[project]
name = "vapt-security-services"
version = "1.0.0"
description = "Security enforcement services for VAPT platform — RBAC, audit, credential isolation, scan windows, IP allowlisting"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "sqlalchemy[asyncio]>=2.0.25",
    "asyncpg>=0.29.0",
    "redis>=5.0.0",
    "aiokafka>=0.10.0",
    "httpx>=0.26.0",
    "hvac>=2.1.0",
    "python-jose[cryptography]>=3.3.0",
    "cryptography>=42.0.0",
    "structlog>=24.1.0",
    "tenacity>=8.2.0",
    "ipaddress>=1.0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
