---
# Analyst Portal ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: analyst-portal
  namespace: vapt-platform
  annotations:
    konghq.com/plugins: jwt-auth,cors-policy,global-rate-limit
    konghq.com/protocols: https
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: kong
  tls:
    - hosts:
        - analyst.vapt-platform.com
      secretName: analyst-portal-tls
  rules:
    - host: analyst.vapt-platform.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: analyst-portal
                port:
                  number: 3000
---
# Customer Portal ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: customer-portal
  namespace: vapt-platform
  annotations:
    konghq.com/plugins: jwt-auth,cors-policy,global-rate-limit
    konghq.com/protocols: https
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: kong
  tls:
    - hosts:
        - portal.vapt-platform.com
      secretName: customer-portal-tls
  rules:
    - host: portal.vapt-platform.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: customer-portal
                port:
                  number: 3000
---
# API ingress — routes to backend services via path prefix
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-gateway
  namespace: vapt-platform
  annotations:
    konghq.com/plugins: jwt-auth,cors-policy,global-rate-limit,request-size-limit
    konghq.com/protocols: https
    konghq.com/strip-path: "false"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: kong
  tls:
    - hosts:
        - api.vapt-platform.com
      secretName: api-gateway-tls
  rules:
    - host: api.vapt-platform.com
      http:
        paths:
          - path: /api/v1/engagements
            pathType: Prefix
            backend:
              service:
                name: engagement-svc
                port:
                  number: 8080
          - path: /api/v1/assets
            pathType: Prefix
            backend:
              service:
                name: asset-discovery-svc
                port:
                  number: 8080
          - path: /api/v1/scans
            pathType: Prefix
            backend:
              service:
                name: scan-orchestrator
                port:
                  number: 8080
          - path: /api/v1/findings
            pathType: Prefix
            backend:
              service:
                name: findings-normalization-svc
                port:
                  number: 8080
          - path: /api/v1/analyst
            pathType: Prefix
            backend:
              service:
                name: analyst-workflow-svc
                port:
                  number: 8080
          - path: /api/v1/analyze
            pathType: Prefix
            backend:
              service:
                name: ai-analyst-assistant
                port:
                  number: 8090
          - path: /api/v1/reports
            pathType: Prefix
            backend:
              service:
                name: reporting-service
                port:
                  number: 8091
          - path: /api/v1/compliance
            pathType: Prefix
            backend:
              service:
                name: compliance-engine-svc
                port:
                  number: 8080
---
# Cert-Manager ClusterIssuer for Let's Encrypt
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ops@vapt-platform.com
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
      - http01:
          ingress:
            class: kong
