---
# ═══════════════════════════════════════════════════════════
# TIER 1: CORE API SERVICES
# ═══════════════════════════════════════════════════════════

# ── 1. Engagement Service ──
apiVersion: apps/v1
kind: Deployment
metadata:
  name: engagement-svc
  namespace: vapt-platform
  labels:
    app.kubernetes.io/name: engagement-svc
    app.kubernetes.io/part-of: vapt-orchestration
    tier: core-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: engagement-svc
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: engagement-svc
        tier: core-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: vapt-platform-sa
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: engagement-svc
          image: vapt-registry/engagement-svc:latest
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: platform-common-config
            - secretRef:
                name: engagement-svc-secrets
          env:
            - name: SERVICE_NAME
              value: engagement-svc
            - name: DB_HOST
              value: vapt-pgbouncer-rw.vapt-data.svc.cluster.local
            - name: DB_NAME
              value: vapt_platform
            - name: KAFKA_BROKERS
              value: vapt-kafka-kafka-bootstrap.vapt-data.svc.cluster.local:9092
            - name: REDIS_URL
              value: redis://redis-master.vapt-data.svc.cluster.local:6379/0
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: engagement-svc
---
apiVersion: v1
kind: Service
metadata:
  name: engagement-svc
  namespace: vapt-platform
spec:
  selector:
    app.kubernetes.io/name: engagement-svc
  ports:
    - port: 8080
      targetPort: http
      name: http

