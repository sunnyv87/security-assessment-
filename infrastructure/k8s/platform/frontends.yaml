---
# ═══════════════════════════════════════════════════════════
# TIER 4: FRONTEND SERVICES
# ═══════════════════════════════════════════════════════════

# ── Analyst Portal (Next.js SSR) ──
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analyst-portal
  namespace: vapt-platform
  labels:
    app.kubernetes.io/name: analyst-portal
    app.kubernetes.io/part-of: vapt-orchestration
    tier: frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: analyst-portal
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: analyst-portal
        tier: frontend
    spec:
      serviceAccountName: vapt-platform-sa
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: analyst-portal
          image: vapt-registry/analyst-portal:latest
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: production
            - name: NEXT_PUBLIC_API_URL
              value: https://api.vapt-platform.com
            - name: NEXT_PUBLIC_WS_URL
              value: wss://api.vapt-platform.com/ws
            - name: NEXTAUTH_URL
              value: https://analyst.vapt-platform.com
          envFrom:
            - secretRef:
                name: analyst-portal-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/.next/cache
      volumes:
        - name: tmp
          emptyDir: {}
        - name: next-cache
          emptyDir:
            sizeLimit: 500Mi
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: analyst-portal
---
apiVersion: v1
kind: Service
metadata:
  name: analyst-portal
  namespace: vapt-platform
spec:
  selector:
    app.kubernetes.io/name: analyst-portal
  ports:
    - port: 3000
      targetPort: http
      name: http

