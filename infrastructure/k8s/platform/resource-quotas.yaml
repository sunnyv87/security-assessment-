apiVersion: v1
kind: ResourceQuota
metadata:
  name: scan-resource-quota
  namespace: vapt-platform
spec:
  hard:
    requests.cpu: "32"
    requests.memory: 64Gi
    limits.cpu: "64"
    limits.memory: 128Gi
    pods: "50"
    count/jobs.batch: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: scan-limit-range
  namespace: vapt-platform
spec:
  limits:
    - type: Container
      default:
        cpu: "2"
        memory: 4Gi
      defaultRequest:
        cpu: "500m"
        memory: 1Gi
      max:
        cpu: "4"
        memory: 8Gi
