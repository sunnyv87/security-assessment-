---
# ── Scan Worker Job Template (created dynamically by scan-orchestrator) ──
# This is a reference template; actual jobs are created programmatically
apiVersion: v1
kind: ConfigMap
metadata:
  name: scan-job-template
  namespace: vapt-platform
data:
  job-template.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: scan-${SCAN_ID}
      namespace: vapt-platform
      labels:
        app.kubernetes.io/name: scan-worker
        scan-id: ${SCAN_ID}
        tenant-id: ${TENANT_ID}
        scanner-type: ${SCANNER_TYPE}
    spec:
      ttlSecondsAfterFinished: 3600
      activeDeadlineSeconds: 14400
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: scan-worker
            scan-id: ${SCAN_ID}
        spec:
          runtimeClassName: gvisor
          serviceAccountName: vapt-platform-sa
          restartPolicy: Never
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: scanner
              image: vapt-registry/${SCANNER_IMAGE}:${SCANNER_VERSION}
              env:
                - name: SCAN_ID
                  value: ${SCAN_ID}
                - name: TENANT_ID
                  value: ${TENANT_ID}
                - name: TARGET_CONFIG
                  value: ${TARGET_CONFIG_JSON}
              resources:
                requests:
                  cpu: "1"
                  memory: 2Gi
                limits:
                  cpu: "4"
                  memory: 8Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: scan-workspace
                  mountPath: /workspace
          volumes:
            - name: scan-workspace
              emptyDir:
                sizeLimit: 10Gi
          tolerations:
            - key: workload
              operator: Equal
              value: scan
              effect: NoSchedule
          nodeSelector:
            workload: scan

---
# RuntimeClass for gVisor sandboxed scan execution
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
handler: runsc
scheduling:
  nodeSelector:
    workload: scan
  tolerations:
    - key: workload
      operator: Equal
      value: scan
      effect: NoSchedule
