---
# ═══════════════════════════════════════════════════════════
# TIER 3: SCAN EXECUTION LAYER
# ═══════════════════════════════════════════════════════════

# ── Scan Orchestrator (Temporal Worker) ──
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scan-orchestrator
  namespace: vapt-platform
  labels:
    app.kubernetes.io/name: scan-orchestrator
    app.kubernetes.io/part-of: vapt-orchestration
    tier: scan-execution
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: scan-orchestrator
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scan-orchestrator
        tier: scan-execution
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: scan-orchestrator-sa
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: scan-orchestrator
          image: vapt-registry/scan-orchestrator:1.0.0
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: platform-common-config
          env:
            - name: SERVICE_NAME
              value: scan-orchestrator
            - name: TEMPORAL_HOST
              value: temporal-frontend.vapt-data.svc.cluster.local:7233
            - name: TEMPORAL_NAMESPACE
              value: vapt-scans
            - name: DB_HOST
              value: vapt-pgbouncer-rw.vapt-data.svc.cluster.local
            - name: KAFKA_BROKERS
              value: vapt-kafka-kafka-bootstrap.vapt-data.svc.cluster.local:9092
            - name: REDIS_URL
              value: redis://redis-master.vapt-data.svc.cluster.local:6379/1
            - name: VAULT_ADDR
              value: https://vault.vapt-data.svc.cluster.local:8200
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      tolerations:
        - key: workload
          operator: Equal
          value: scan
          effect: NoSchedule
      nodeSelector:
        workload: scan
---
apiVersion: v1
kind: Service
metadata:
  name: scan-orchestrator
  namespace: vapt-platform
spec:
  selector:
    app.kubernetes.io/name: scan-orchestrator
  ports:
    - port: 8080
      targetPort: http

---
# Service account with RBAC to create K8s Jobs for scan workers
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scan-orchestrator-sa
  namespace: vapt-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: scan-job-manager
  namespace: vapt-platform
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
    # Add resourceNames prefix restriction via labels
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: scan-orchestrator-job-manager
  namespace: vapt-platform
subjects:
  - kind: ServiceAccount
    name: scan-orchestrator-sa
    namespace: vapt-platform
roleRef:
  kind: Role
  name: scan-job-manager
  apiGroup: rbac.authorization.k8s.io

