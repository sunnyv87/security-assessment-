---
# ═══════════════════════════════════════════════════════════
# TIER 2: AI & REPORT SERVICES
# ═══════════════════════════════════════════════════════════

# ── AI Analyst Assistant ──
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-analyst-assistant
  namespace: vapt-platform
  labels:
    app.kubernetes.io/name: ai-analyst-assistant
    app.kubernetes.io/part-of: vapt-orchestration
    tier: ai-reporting
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-analyst-assistant
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-analyst-assistant
        tier: ai-reporting
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8090"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: vapt-platform-sa
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ai-analyst-assistant
          image: vapt-registry/ai-analyst-assistant:1.0.0
          ports:
            - containerPort: 8090
              name: http
          envFrom:
            - configMapRef:
                name: platform-common-config
            - secretRef:
                name: ai-analyst-secrets
          env:
            - name: SERVICE_NAME
              value: ai-analyst-assistant
            - name: AI_API_PORT
              value: "8090"
            - name: DB_HOST
              value: vapt-pgbouncer-rw.vapt-data.svc.cluster.local
            - name: DB_NAME
              value: vapt_platform
            - name: KAFKA_BROKERS
              value: vapt-kafka-kafka-bootstrap.vapt-data.svc.cluster.local:9092
            - name: REDIS_URL
              value: redis://redis-master.vapt-data.svc.cluster.local:6379/2
            - name: CLAUDE_MODEL
              value: claude-opus-4-6
            - name: CLAUDE_MAX_TOKENS
              value: "16384"
            - name: CLAUDE_TEMPERATURE
              value: "0.1"
          resources:
            requests:
              cpu: 1000m
              memory: 2Gi
            limits:
              cpu: 2000m
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: ai-analyst-assistant
---
apiVersion: v1
kind: Service
metadata:
  name: ai-analyst-assistant
  namespace: vapt-platform
spec:
  selector:
    app.kubernetes.io/name: ai-analyst-assistant
  ports:
    - port: 8090
      targetPort: http
      name: http

---
# ── Reporting Service ──
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reporting-service
  namespace: vapt-platform
  labels:
    app.kubernetes.io/name: reporting-service
    app.kubernetes.io/part-of: vapt-orchestration
    tier: ai-reporting
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: reporting-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: reporting-service
        tier: ai-reporting
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8091"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: vapt-platform-sa
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: reporting-service
          image: vapt-registry/reporting-service:1.0.0
          ports:
            - containerPort: 8091
              name: http
          envFrom:
            - configMapRef:
                name: platform-common-config
            - secretRef:
                name: reporting-svc-secrets
          env:
            - name: SERVICE_NAME
              value: reporting-service
            - name: REPORT_API_PORT
              value: "8091"
            - name: DB_HOST
              value: vapt-pgbouncer-rw.vapt-data.svc.cluster.local
            - name: DB_NAME
              value: vapt_platform
            - name: KAFKA_BROKERS
              value: vapt-kafka-kafka-bootstrap.vapt-data.svc.cluster.local:9092
            - name: MINIO_ENDPOINT
              value: minio.vapt-data.svc.cluster.local:9000
            - name: MINIO_SECURE
              value: "false"
          resources:
            requests:
              cpu: 1000m
              memory: 2Gi
            limits:
              cpu: 2000m
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: font-cache
              mountPath: /home/appuser/.cache
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: font-cache
          emptyDir:
            sizeLimit: 100Mi
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: reporting-service
---
apiVersion: v1
kind: Service
metadata:
  name: reporting-service
  namespace: vapt-platform
spec:
  selector:
    app.kubernetes.io/name: reporting-service
  ports:
    - port: 8091
      targetPort: http
      name: http
