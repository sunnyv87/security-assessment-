---
# Strimzi Kafka Cluster — 3 brokers with multi-AZ, schema registry
# Requires: kubectl apply -f https://strimzi.io/install/latest?namespace=vapt-data
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: vapt-kafka
  namespace: vapt-data
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: vapt-orchestration
spec:
  kafka:
    version: 3.7.0
    replicas: 3
    listeners:
      - name: tls
        port: 9093
        type: internal
        tls: true
        authentication:
          type: tls
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
      num.partitions: 12
      log.retention.hours: 168
      log.segment.bytes: 1073741824
      log.retention.check.interval.ms: 300000
      auto.create.topics.enable: false
      message.max.bytes: 10485760
    storage:
      type: persistent-claim
      size: 500Gi
      class: gp3-encrypted
      deleteClaim: false
    resources:
      requests:
        cpu: "1"
        memory: 4Gi
      limits:
        cpu: "2"
        memory: 8Gi
    template:
      pod:
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels:
                    strimzi.io/name: vapt-kafka-kafka
                topologyKey: topology.kubernetes.io/zone
        tolerations:
          - key: workload
            operator: Equal
            value: data
            effect: NoSchedule
    metricsConfig:
      type: jmxPrometheusExporter
      valueFrom:
        configMapKeyRef:
          name: kafka-metrics-config
          key: kafka-metrics.yaml
  zookeeper:
    replicas: 3
    storage:
      type: persistent-claim
      size: 50Gi
      class: gp3-encrypted
      deleteClaim: false
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: "1"
        memory: 4Gi
    template:
      pod:
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels:
                    strimzi.io/name: vapt-kafka-zookeeper
                topologyKey: topology.kubernetes.io/zone
        tolerations:
          - key: workload
            operator: Equal
            value: data
            effect: NoSchedule
  entityOperator:
    topicOperator:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
    userOperator:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi

---
