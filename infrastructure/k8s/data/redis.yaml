---
# Redis 7 with Sentinel HA — 1 master + 2 replicas + 3 sentinels
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: vapt-data
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: vapt-orchestration
spec:
  serviceName: redis-headless
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9121"
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      tolerations:
        - key: workload
          operator: Equal
          value: data
          effect: NoSchedule
      nodeSelector:
        workload: data
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: redis
              topologyKey: topology.kubernetes.io/zone
      containers:
        - name: redis
          image: redis:7.2-alpine
          command:
            - redis-server
            - /etc/redis/redis.conf
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              cpu: 500m
              memory: 8Gi
            limits:
              cpu: "2"
              memory: 16Gi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/redis
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 20
        - name: redis-exporter
          image: oliver006/redis_exporter:v1.57.0
          ports:
            - containerPort: 9121
              name: metrics
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: redis-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: gp3-encrypted
        resources:
          requests:
            storage: 50Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: vapt-data
data:
  redis.conf: |
    bind 0.0.0.0
    port 6379
    maxmemory 14gb
    maxmemory-policy allkeys-lru
    save 3600 1
    save 300 100
    appendonly yes
    appendfsync everysec
    dir /data
    loglevel notice
    tcp-keepalive 300
    timeout 0
    databases 16
---
apiVersion: v1
kind: Service
metadata:
  name: redis-master
  namespace: vapt-data
spec:
  selector:
    app.kubernetes.io/name: redis
    statefulset.kubernetes.io/pod-name: redis-0
  ports:
    - port: 6379
      targetPort: redis
---
apiVersion: v1
kind: Service
metadata:
  name: redis-headless
  namespace: vapt-data
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: redis
  ports:
    - port: 6379
      targetPort: redis
