---
# CloudNativePG Cluster — PostgreSQL 16 with HA, PITR, pgvector
# Requires: kubectl apply -f https://raw.githubusercontent.com/cloudnative-pg/cloudnative-pg/main/releases/cnpg-1.22.yaml
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: vapt-postgresql
  namespace: vapt-data
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/part-of: vapt-orchestration
spec:
  instances: 3

  imageName: ghcr.io/cloudnative-pg/postgresql:16.2

  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: 4GB
      effective_cache_size: 12GB
      work_mem: 64MB
      maintenance_work_mem: 512MB
      random_page_cost: "1.1"
      effective_io_concurrency: "200"
      wal_buffers: 64MB
      min_wal_size: 2GB
      max_wal_size: 8GB
      max_worker_processes: "8"
      max_parallel_workers_per_gather: "4"
      max_parallel_workers: "8"
      log_min_duration_statement: "1000"
      log_checkpoints: "on"
      log_connections: "on"
      log_disconnections: "on"
      pg_stat_statements.track: all
      shared_preload_libraries: "pg_stat_statements,pgvector"
    pg_hba:
      - hostssl all all 10.0.0.0/8 scram-sha-256 clientcert=verify-ca

  enableSuperuserAccess: false

  bootstrap:
    initdb:
      database: vapt_platform
      owner: vapt_app
      postInitSQL:
        - CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
        - CREATE EXTENSION IF NOT EXISTS "pgvector";
        - CREATE EXTENSION IF NOT EXISTS "pg_stat_statements";
        - CREATE EXTENSION IF NOT EXISTS "pg_cron";
        - ALTER SYSTEM SET row_security = on;

  storage:
    size: 500Gi
    storageClass: gp3-encrypted

  walStorage:
    size: 50Gi
    storageClass: gp3-encrypted

  resources:
    requests:
      cpu: "2"
      memory: 8Gi
    limits:
      cpu: "4"
      memory: 16Gi

  affinity:
    topologyKey: topology.kubernetes.io/zone
    nodeSelector:
      workload: data

  backup:
    barmanObjectStore:
      destinationPath: s3://vapt-postgresql-backups/
      s3Credentials:
        accessKeyId:
          name: postgresql-s3-creds
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: postgresql-s3-creds
          key: SECRET_ACCESS_KEY
      wal:
        compression: gzip
        maxParallel: 4
      data:
        compression: gzip
    retentionPolicy: "30d"

  monitoring:
    enablePodMonitor: true

  nodeMaintenanceWindow:
    inProgress: false
    reusePVC: true

---
# Scheduled backup (daily full)
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: vapt-postgresql-daily
  namespace: vapt-data
spec:
  schedule: "0 2 * * *"
  backupOwnerReference: self
  cluster:
    name: vapt-postgresql

---
# PgBouncer pooler for connection management
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: vapt-pgbouncer
  namespace: vapt-data
spec:
  cluster:
    name: vapt-postgresql
  instances: 2
  type: rw
  pgbouncer:
    poolMode: transaction
    parameters:
      max_client_conn: "400"
      default_pool_size: "25"
      min_pool_size: "5"
      reserve_pool_size: "5"
      reserve_pool_timeout: "3"
      server_idle_timeout: "600"
      query_wait_timeout: "120"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pgbouncer
    spec:
      containers:
        - name: pgbouncer
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
