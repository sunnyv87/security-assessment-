---
# ═══════════════════════════════════════════════════════════
# HORIZONTAL POD AUTOSCALERS
# ═══════════════════════════════════════════════════════════

# ── Tier 1: Core API Services ──

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: engagement-svc
  namespace: vapt-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: engagement-svc
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: asset-discovery-svc
  namespace: vapt-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
